<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <title>Drill 2</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #10091d;
            --panel: #1e1430;
            --purple: #9b6bff;
            --lavender: #d8baff;
            --text: #f7f2ff;
            --muted: #a99bbd;
            --border: rgba(190, 145, 255, 0.22);
        }

        body {
            min-height: 100vh;
            padding: 36px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(ellipse at 15% 15%, #39205b, transparent 45%),
                radial-gradient(ellipse at 90% 90%, #2c1649, transparent 40%),
                var(--bg);
        }

        .page {
            width: 100%;
            max-width: 760px;
        }

        /* Header */

        .topbar {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 26px;
        }

        .logo {
            width: 52px;
            height: 52px;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            border-radius: 16px;
            background: linear-gradient(135deg, #c7a5ff, #7039d1);
            box-shadow: 0 0 28px rgba(155, 107, 255, 0.25);
            color: white;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .brand-name {
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 1.6px;
        }

        .brand-subtitle {
            margin-top: 5px;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 1.3px;
        }

        .status {
            margin-left: auto;
            padding: 9px 12px;
            border: 1px solid var(--border);
            border-radius: 30px;
            background: rgba(155, 107, 255, 0.08);
            color: var(--lavender);
            font-size: 10px;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-dot {
            color: #bba0ff;
            margin-right: 5px;
        }

        /* Main panel */

        .main-card {
            position: relative;
            padding: 38px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: rgba(30, 20, 48, 0.94);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .main-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(
                90deg,
                transparent,
                #c5a0ff,
                transparent
            );
        }

        h1 {
            font-size: clamp(28px, 5vw, 40px);
            line-height: 1.25;
            letter-spacing: -1.2px;
        }

        h1 span {
            color: var(--lavender);
        }

        .title-line {
            width: 54px;
            height: 4px;
            margin-top: 20px;
            border-radius: 10px;
            background: linear-gradient(90deg, #a970ff, #d8baff);
        }

        /* Input fields */

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-top: 30px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            color: #e5d9f7;
            font-size: 11px;
            font-weight: 750;
            letter-spacing: 1.2px;
        }

        input[type="text"] {
            width: 100%;
            min-width: 0;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 12px;
            outline: none;
            background: #160d25;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]::placeholder {
            color: #81728f;
        }

        input[type="text"]:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(155, 107, 255, 0.13);
        }

        /* Add button */

        .add-button {
            width: 100%;
            margin-top: 22px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            background: linear-gradient(100deg, #9558e8, #713bc1);
            color: white;
            font-family: inherit;
            font-size: 14px;
            font-weight: 750;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(133, 73, 213, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .add-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(153, 100, 236, 0.3);
        }

        .add-button:active {
            transform: translateY(0);
        }

        /* Member directory */

        .divider {
            height: 1px;
            margin: 30px 0;
            background: var(--border);
        }

        .members-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .members-header h2 {
            font-size: 17px;
            font-weight: 750;
        }

        .members-label {
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.2px;
        }

        #output {
            min-height: 100px;
            padding: 20px;
            border: 1px solid rgba(190, 145, 255, 0.15);
            border-radius: 14px;
            background: rgba(16, 9, 29, 0.7);
            color: #ded0ef;
            font-size: 13px;
            line-height: 1.9;
            overflow-wrap: anywhere;
        }

        #output p {
            margin: 0;
        }

        #output ul {
            padding-left: 22px;
        }

        #output li {
            padding: 5px 0;
        }

        /* Footer */

        footer {
            margin-top: 22px;
            color: #877895;
            font-size: 10px;
            text-align: center;
            letter-spacing: 1px;
        }

        /* Mobile layout */

        @media (max-width: 520px) {
            body {
                padding: 24px 14px;
                align-items: flex-start;
            }

            .topbar {
                gap: 10px;
                margin-bottom: 20px;
            }

            .logo {
                width: 44px;
                height: 44px;
                border-radius: 13px;
                font-size: 16px;
            }

            .brand-name {
                font-size: 12px;
                letter-spacing: 1px;
            }

            .brand-subtitle {
                font-size: 9px;
                letter-spacing: 0.6px;
            }

            .status {
                padding: 7px 8px;
                font-size: 9px;
            }

            .main-card {
                padding: 26px 20px;
                border-radius: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 18px;
                margin-top: 25px;
            }

            .members-label {
                font-size: 8px;
                letter-spacing: 0.5px;
            }
        }
    </style>
</head>

<body>
    <main class="page">

        <header class="topbar">
            <div class="logo">ICT</div>

            <div>
                <div class="brand-name">CAMPUS ICT10</div>
                <div class="brand-subtitle">STUDENT CLUB SYSTEM</div>
            </div>

            <div class="status">
                <span class="status-dot">●</span> MEMBER PORTAL
            </div>
        </header>

        <section class="main-card">

            <h1>
                Student Club<br>
                <span>Member Manager</span>
            </h1>

            <div class="title-line"></div>

            <form>
                <div class="form-grid">

                    <div class="field">
                        <label for="firstName">FIRST NAME</label>
                        <input
                            type="text"
                            id="firstName"
                            placeholder="Enter first name"
                            autocomplete="given-name"
                        >
                    </div>

                    <div class="field">
                        <label for="lastName">LAST NAME</label>
                        <input
                            type="text"
                            id="lastName"
                            placeholder="Enter last name"
                            autocomplete="family-name"
                        >
                    </div>

                </div>

                <input
                    type="button"
                    class="add-button"
                    py-click="add_member"
                    value="＋ Add Member"
                >
            </form>

            <div class="divider"></div>

            <div class="members-header">
                <h2>Club Members</h2>
                <span class="members-label">MEMBER DIRECTORY</span>
            </div>

            <div id="output" aria-live="polite">
                <p>Your member list will appear here.</p>
                <p>Start by adding a student above.</p>
            </div>

        </section>

        <footer>
            CAMPUS ICT10 · CLUB MANAGEMENT SYSTEM · Q2 DRILL 2
        </footer>

    </main>

    <script type="py" src="main.py"></script>
</body>
</html>
